[versions]
agp = "8.13.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
# Hilt Gradle plugin 2.59+ requires AGP 9; the plugin only wires bytecode transforms, the runtime/compiler (which must read Kotlin 2.4 metadata) are 2.60.1.
hilt-plugin = "2.58"
gms = "4.4.4"
compose-bom = "2025.08.00"
firebase-ai = "18.2.0"
firebase-ai-ondevice = "16.0.0-beta08"
firebase-ai-ksp = "17.0.0"
firebase-appcheck = "20.1.0"
firebase-common = "23.0.0"
core-ktx = "1.16.0"
lifecycle = "2.9.2"
activity-compose = "1.10.1"
navigation-compose = "2.9.3"
hilt-navigation-compose = "1.2.0"
coroutines = "1.10.2"
room = "2.8.5"
datastore = "1.1.7"
okhttp = "4.12.0"
retrofit = "2.11.0"
moshi = "1.15.2"
serialization-json = "1.11.0"
json-schema-validator = "1.5.9"
timber = "5.0.1"
junit = "4.13.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
firebase-common = { group = "com.google.firebase", name = "firebase-common", version.ref = "firebase-common" }
firebase-ai = { group = "com.google.firebase", name = "firebase-ai", version.ref = "firebase-ai" }
firebase-ai-ondevice = { group = "com.google.firebase", name = "firebase-ai-ondevice", version.ref = "firebase-ai-ondevice" }
firebase-ai-ksp = { group = "com.google.firebase", name = "firebase-ai-ksp-processor", version.ref = "firebase-ai-ksp" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity", version.ref = "firebase-appcheck" }
